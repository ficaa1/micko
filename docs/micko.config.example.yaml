# Copy to ~/.config/micko/config.yaml or select with --config.
# Actions ask for confirmation for each request; --read-only turns them off.
currentProfile: dev
refreshInterval: 5s
# Colour skin: default (the terminal's own palette), auto (dark or light
# from the terminal background), catppuccin-mocha, catppuccin-latte,
# gruvbox-dark, gruvbox-light, nord, dracula, tokyo-night, solarized-dark,
# solarized-light, one-dark, rose-pine, rose-pine-dawn or monokai.
# --skin overrides it; a profile's own skin overrides it for that profile.
# skin: default

# Every write attempt is appended to $XDG_STATE_HOME/micko/actions.jsonl
# (default ~/.local/state/micko/actions.jsonl). Uncomment to turn it off.
# journal: false

# Open every workflow with parameter and output values hidden (v reveals).
# A profile can set it too, overriding this line either way.
# redactValues: true

# Put Mićko, the mascot, on the pane on terminals of 80x40 and larger: true
# (or perch) perches him on its top border, floor sits him in its bottom
# corner. He costs three rows perched, four on the floor. --mascot and --mascot=floor do the same, and
# :mascot moves him from perch to floor to off.
# mascot: true

# Notifications. W on the list watches workflows for phase changes.
# notifications:
#   suspended: true            # also notify when any workflow becomes suspended
#   watched: true              # notify on phase changes of watched workflows
#   via: [desktop, terminal]   # desktop, bell, terminal (OSC 9), sound
#   activate: org.alacritty    # app a click on a banner brings forward
#   sound: Glass               # from /System/Library/Sounds, for via: sound

profiles:
  dev:
    # Omit these four fields to connect directly to server instead.
    kubeContext: my-cluster
    service: argo-workflows-server
    serviceNamespace: argo  # defaults to the workflow namespace below
    remotePort: 2746
    # With forwarding, only the scheme and path prefix are used.
    # Use https when Argo expects TLS; caFile supplies a custom CA.
    server: http://127.0.0.1:2746
    namespace: workflows
    # A source is required even for tokenless server auth: leave this
    # variable unset/empty to send no Authorization header.
    tokenEnv: MICKO_TOKEN
    # Use tokenFile INSTEAD of tokenEnv; the path must be absolute.
    # tokenFile: /absolute/path/to/token
    # caFile: /absolute/path/to/ca.pem
    # Include empty namespaces that discovery may not find.
    # namespaces: [workflows, batch]
    # Browser address for the o key, independent of the forwarded endpoint.
    # webURL: https://argo.example.com
    # Initial command in the log pipe editor; must be installed separately.
    # pipeCommand: lnav
    # This profile's own skin, e.g. a warm one for production.
    # skin: gruvbox-dark
    # redactValues: true
