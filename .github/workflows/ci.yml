# Routine checks and opt-in deployment compatibility checks. See docs/development.md.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deployment_compatibility:
        description: Provision a disposable Argo v4.1.2 cluster and run deployment checks
        type: boolean
        default: false
      external_e2e:
        description: Run the separately allowlisted external-cluster E2E journey
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.3"
  KIND_VERSION: "v0.33.0"
  KUBECTL_VERSION: "v1.37.0"

jobs:
  nix:
    name: Nix package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check whether Nix packaging can change
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          build = True
          base = os.environ["BASE"]
          if os.environ["EVENT"] != "workflow_dispatch" and base and set(base) != {"0"}:
              separator = "..." if os.environ["EVENT"] == "pull_request" else ".."
              diff = base + separator + os.environ["HEAD"]
              try:
                  paths = os.fsdecode(subprocess.check_output([
                      "git", "diff", "--no-renames", "--name-only", "-z", diff
                  ])).split("\0")
              except subprocess.CalledProcessError:
                  print("Cannot compare changed paths; build Nix package")
              else:
                  paths = [path for path in paths if path]
                  build = any(
                      not (path.startswith("docs/") or ("/" not in path and path.endswith(".md")))
                      for path in paths
                  )
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"build={str(build).lower()}\n")
          print("Build Nix package" if build else "Only documentation changed; skip Nix build")
          PY
      - uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035 # v34
        if: steps.changes.outputs.build == 'true'
      - run: nix flake check --all-systems --no-update-lock-file
        if: steps.changes.outputs.build == 'true'

  check:
    # micko is a terminal program, and the two terminals it has to work in
    # are Linux and macOS. The macOS paths — the config directory, the PTY,
    # the clipboard write — are checked on main and on a manual run. A pull
    # request runs on Linux only, because a macOS minute is billed at ten
    # Linux minutes.
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest"]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "${{ env.GO_VERSION }}"

      - name: gofmt
        run: |
          out="$(gofmt -l cmd internal tests)"
          if [ -n "$out" ]; then
            echo "::error::gofmt needed on:" "$out"
            exit 1
          fi

      - name: vet
        run: go vet -tags=integration,e2e,compat ./...

      - name: Unused production code
        if: runner.os == 'Linux'
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 -checks U1000 -tags integration,e2e,compat ./...

      - name: Compatibility runner syntax and cleanup
        if: runner.os == 'Linux'
        run: |
          curl -fsSL --retry 3 https://github.com/argoproj/argo-workflows/releases/download/v4.1.2/install.yaml -o "$RUNNER_TEMP/argo-install.yaml"
          python3 scripts/compat/test_runner.py "$RUNNER_TEMP/argo-install.yaml"

      - name: Check release-channel updater
        if: runner.os == 'Linux'
        run: python3 scripts/test-nix-stable.py

      # One run with the race detector: it fails on everything a plain run
      # fails on. It needs CGO and a C toolchain.
      - name: unit tests with the race detector
        run: go test -race ./... -count=1

      # Fixture-server conformance over real HTTP, plus real PTY process
      # lifecycle. Both runners provide a PTY, so nothing skips on either.
      - name: integration and PTY
        run: go test -tags=integration ./tests/integration/... -count=1

      - name: build
        run: go build -o dist/micko ./cmd/micko

      # Starting with no arguments opens the profile picker, which needs a
      # terminal. This runner has none, so the smoke check is the path that
      # refuses before anything starts: a profile no config file names.
      - name: smoke
        run: |
          ./dist/micko --version
          set +e
          ./dist/micko --config /dev/null --profile no-such-profile >/dev/null 2>&1
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "::error::an unknown profile exited with $status, want 1"
            exit 1
          fi

  e2e:
    name: e2e (opt-in)
    # Real tier: explicit dispatch only, never on plain push or PR.
    if: github.event_name == 'workflow_dispatch' && inputs.external_e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "${{ env.GO_VERSION }}"
      - name: Install pinned kind
        run: |
          curl -fsSL -o kind \
            "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x kind && sudo mv kind /usr/local/bin/kind
          kind version
      - name: Install pinned kubectl
        run: |
          curl -fsSL -o kubectl \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f  kubectl" | sha256sum -c -
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/kubectl
      - name: Run e2e only when an allowlist secret exists
        env:
          E2E_CONFIG_B64: ${{ secrets.E2E_ALLOWLIST_B64 }}
        run: |
          if [ -z "$E2E_CONFIG_B64" ]; then
            echo "::error::External E2E requested but E2E_ALLOWLIST_B64 is absent."
            exit 1
          fi
          echo "$E2E_CONFIG_B64" | base64 -d > e2e-config.yaml
          MICKO_E2E=1 MICKO_E2E_CONFIG=./e2e-config.yaml \
            go test -tags=e2e ./tests/e2e/... -count=1 -v

  windows:
    name: Windows unit and transport smoke
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "${{ env.GO_VERSION }}"
      - name: Unit tests and HTTP integration fixtures
        run: |
          go test ./... -count=1
          go test -tags=integration ./tests/integration/... -count=1
          go vet -tags=integration,e2e,compat ./...
      - name: Build and startup smoke
        run: |
          go build -o dist/micko.exe ./cmd/micko
          ./dist/micko.exe --version
          echo "profiles: {}" > "$RUNNER_TEMP/empty-micko.yaml"
          set +e
          ./dist/micko.exe --config "$RUNNER_TEMP/empty-micko.yaml" --profile missing 2>/dev/null
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "::error::an unknown profile exited with $status, want 1"
            exit 1
          fi

  deployment-compatibility:
    name: Disposable Argo v4.1.2 compatibility
    if: github.event_name == 'workflow_dispatch' && inputs.deployment_compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "${{ env.GO_VERSION }}"
      - name: Install pinned cluster tools
        run: |
          curl -fsSL -o kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  kind" | sha256sum -c -
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
          curl -fsSL -o kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f  kubectl" | sha256sum -c -
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
      - name: Provision, exercise and clean up
        run: scripts/compat/argo.sh
