# Routine checks on push and pull requests. The disposable-cluster E2E job
# needs manual dispatch and E2E_ALLOWLIST_B64; it does not provision an Argo
# environment. See docs/development.md.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.4"
  KIND_VERSION: "v0.33.0"
  KUBECTL_VERSION: "v1.37.0"

jobs:
  nix:
    name: Nix package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035 # v34
      - run: nix flake check --all-systems --no-update-lock-file
      - name: Check release-channel updater
        run: python3 scripts/test-nix-stable.py

  check:
    # micko is a terminal program, and the two terminals it has to work in
    # are Linux and macOS. The macOS paths — the config directory, the PTY,
    # the clipboard write — are checked on main and on a manual run. A pull
    # request runs on Linux only, because a macOS minute is billed at ten
    # Linux minutes.
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest"]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "${{ env.GO_VERSION }}"

      - name: gofmt
        run: |
          out="$(gofmt -l cmd internal tests)"
          if [ -n "$out" ]; then
            echo "::error::gofmt needed on:" "$out"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      # One run with the race detector: it fails on everything a plain run
      # fails on. It needs CGO and a C toolchain.
      - name: unit tests with the race detector
        run: go test -race ./... -count=1

      # Fixture-server conformance over real HTTP, plus real PTY process
      # lifecycle. Both runners provide a PTY, so nothing skips on either.
      - name: integration and PTY
        run: go test -tags=integration ./tests/integration/... -count=1

      - name: build
        run: go build -o dist/micko ./cmd/micko

      # Starting with no arguments opens the profile picker, which needs a
      # terminal. This runner has none, so the smoke check is the path that
      # refuses before anything starts: a profile no config file names.
      - name: smoke
        run: |
          ./dist/micko --version
          set +e
          ./dist/micko --config /dev/null --profile no-such-profile >/dev/null 2>&1
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "::error::an unknown profile exited with $status, want 1"
            exit 1
          fi

  e2e:
    name: e2e (opt-in)
    # Real tier: explicit dispatch only, never on plain push or PR.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "${{ env.GO_VERSION }}"
      - name: Install pinned kind
        run: |
          curl -fsSL -o kind \
            "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x kind && sudo mv kind /usr/local/bin/kind
          kind version
      - name: Install pinned kubectl
        run: |
          curl -fsSL -o kubectl \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f  kubectl" | sha256sum -c -
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/kubectl
      - name: Run e2e only when an allowlist secret exists
        env:
          E2E_CONFIG_B64: ${{ secrets.E2E_ALLOWLIST_B64 }}
        run: |
          if [ -z "$E2E_CONFIG_B64" ]; then
            echo "E2E_ALLOWLIST_B64 not set — skipping REAL tier (recorded BLOCKED, not silent pass)."
            exit 0
          fi
          echo "$E2E_CONFIG_B64" | base64 -d > e2e-config.yaml
          MICKO_E2E=1 MICKO_E2E_CONFIG=./e2e-config.yaml \
            go test -tags=e2e ./tests/e2e/... -count=1 -v
