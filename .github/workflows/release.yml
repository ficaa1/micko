# Builds and publishes a GitHub release when a v* tag is pushed.
#
# The tag must match the version the binary reports, or the job stops before
# it publishes: the tag and the binary must never announce different
# versions. internal/buildinfo.Version is the source of that number.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GO_VERSION: "1.25.4"

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "${{ env.GO_VERSION }}"

      - name: Check
        run: |
          gofmt -l cmd internal tests | tee /tmp/unformatted
          test ! -s /tmp/unformatted
          go vet ./...
          go test ./... -count=1

      - name: Tag must match the version the binary reports
        id: version
        run: |
          go build -o /tmp/argo-tui ./cmd/argo-tui
          built="$(/tmp/argo-tui --version | awk '{print $2}')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$built" ]; then
            echo "::error::tag $GITHUB_REF_NAME says $tag, the binary says $built (set internal/buildinfo.Version)"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          commit="$(git rev-parse --short HEAD)"
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build \
              -ldflags "-s -w -X github.com/ficaa1/argo-tui/internal/buildinfo.Commit=$commit" \
              -o dist/argo-tui ./cmd/argo-tui
            tar -czf "dist/argo-tui_${VERSION}_${os}_${arch}.tar.gz" \
              -C dist argo-tui \
              -C "$GITHUB_WORKSPACE" README.md CHANGELOG.md
            rm dist/argo-tui
          done
          cd dist && sha256sum ./*.tar.gz > checksums.txt && cat checksums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*.tar.gz dist/checksums.txt

      # The formula is written from the checksums this job just produced, so
      # the tap can never point at a build it did not verify. A pre-release
      # tag (v0.3.0-rc.1) publishes but does not move the tap: `brew install`
      # must stay on the last stable version.
      #
      # HOMEBREW_TAP_TOKEN is a token with contents write access to
      # ficaa1/homebrew-tap and nothing else. Without it the step fails the
      # job rather than leaving a release whose tap silently did not move.
      - name: Update the Homebrew tap
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set; the tap would stay on the previous version"
            exit 1
          fi
          sha() {
            awk -v f="./argo-tui_${VERSION}_$1.tar.gz" '$2 == f {print $1}' dist/checksums.txt
          }
          for target in darwin_arm64 darwin_amd64 linux_amd64 linux_arm64; do
            if [ -z "$(sha "$target")" ]; then
              echo "::error::no checksum for $target in dist/checksums.txt"
              exit 1
            fi
          done
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/ficaa1/homebrew-tap.git" tap
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          mkdir -p tap/Formula
          cat > tap/Formula/argo-tui.rb <<FORMULA
          # Generated by the argo-tui release workflow. Do not edit by hand:
          # the next release overwrites this file.
          class ArgoTui < Formula
            desc "Keyboard-first terminal UI for Argo Workflows"
            homepage "https://github.com/${GITHUB_REPOSITORY}"
            version "${VERSION}"
            license "GPL-3.0-only"
            on_macos do
              on_arm do
                url "${base}/argo-tui_${VERSION}_darwin_arm64.tar.gz"
                sha256 "$(sha darwin_arm64)"
              end
              on_intel do
                url "${base}/argo-tui_${VERSION}_darwin_amd64.tar.gz"
                sha256 "$(sha darwin_amd64)"
              end
            end
            on_linux do
              on_arm do
                url "${base}/argo-tui_${VERSION}_linux_arm64.tar.gz"
                sha256 "$(sha linux_arm64)"
              end
              on_intel do
                url "${base}/argo-tui_${VERSION}_linux_amd64.tar.gz"
                sha256 "$(sha linux_amd64)"
              end
            end
            def install
              bin.install "argo-tui"
            end
            test do
              assert_match version.to_s, shell_output("#{bin}/argo-tui --version")
            end
          end
          FORMULA
          cd tap
          if git diff --quiet; then
            echo "formula already at ${VERSION}"
            exit 0
          fi
          git config user.name "argo-tui release"
          git config user.email "noreply@github.com"
          git commit -am "argo-tui ${VERSION}"
          git push
