# Builds and publishes a GitHub release when a v* tag is pushed, or when the
# workflow is run by hand with a version. Run by hand, the release creates its
# tag on the commit the run checked out, so a release can be cut from the
# Actions tab without pushing a tag.
#
# The tag must match the version the binary reports, or the job stops before
# it publishes: the tag and the binary must never announce different
# versions. internal/buildinfo.Version is the source of that number.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v; it must match internal/buildinfo.Version"
        required: true

permissions:
  contents: write

env:
  GO_VERSION: "1.25.4"
  # TAG is the release's tag: the pushed one, or v and the version a run by
  # hand was given.
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ format('v{0}', steps.version.outputs.version) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "${{ env.GO_VERSION }}"

      - name: Check out the tag of a version already released
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git checkout -q "$TAG"
          fi

      - name: Check
        run: |
          gofmt -l cmd internal tests | tee /tmp/unformatted
          test ! -s /tmp/unformatted
          go vet ./...
          go test ./... -count=1

      - name: Tag must match the version the binary reports
        id: version
        run: |
          go build -o /tmp/micko ./cmd/micko
          built="$(/tmp/micko --version | awk '{print $2}')"
          tag="${TAG#v}"
          if [ "$tag" != "$built" ]; then
            echo "::error::tag $TAG says $tag, the binary says $built (set internal/buildinfo.Version)"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035 # v34

      - name: Check Nix release package
        run: |
          nix flake check --all-systems --no-update-lock-file
          nix build --no-update-lock-file
          built="$(./result/bin/micko --version | awk '{print $2}')"
          test "$built" = "${TAG#v}"

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          commit="$(git rev-parse --short HEAD)"
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            bin=micko
            [ "$os" = windows ] && bin=micko.exe
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build \
              -ldflags "-s -w -X github.com/ficaa1/micko/internal/buildinfo.Commit=$commit" \
              -o "dist/$bin" ./cmd/micko
            name="micko_${VERSION}_${os}_${arch}"
            if [ "$os" = windows ]; then
              zip -jq "dist/$name.zip" "dist/$bin" README.md CHANGELOG.md
            else
              tar -czf "dist/$name.tar.gz" \
                -C dist "$bin" \
                -C "$GITHUB_WORKSPACE" README.md CHANGELOG.md
            fi
            rm "dist/$bin"
          done
          cd dist && sha256sum ./*.tar.gz ./*.zip > checksums.txt && cat checksums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A rebuilt archive differs byte for byte from the published one,
            # so the published checksums stay, and the tap below reads them.
            gh release download "$TAG" --pattern checksums.txt --dir /tmp/published
            have="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
            for f in dist/*.tar.gz dist/*.zip; do
              n="$(basename "$f")"
              if grep -qxF "$n" <<<"$have"; then continue; fi
              grep -F " ./$n" dist/checksums.txt >> /tmp/published/checksums.txt
              gh release upload "$TAG" "$f"
            done
            cp /tmp/published/checksums.txt dist/checksums.txt
            gh release upload "$TAG" dist/checksums.txt --clobber
            exit 0
          fi
          # The notes are the version's CHANGELOG.md section.
          awk -v v="## ${VERSION}" '$0 == v {f = 1; next} /^## / {f = 0} f' CHANGELOG.md \
            | sed '/./,$!d' > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${VERSION}"
            exit 1
          fi
          # --target is the commit a run by hand tags. A pushed tag already
          # exists, and gh publishes it as it is.
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file /tmp/notes.md \
            dist/*.tar.gz dist/*.zip dist/checksums.txt

      - name: Update the Nix stable channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/update-nix-stable.sh

      # The formula is written from the checksums this job just produced, so
      # the tap can never point at a build it did not verify. A pre-release
      # tag (v0.3.0-rc.1) publishes but does not move the tap: `brew install`
      # must stay on the last stable version.
      #
      # HOMEBREW_TAP_TOKEN is a token with contents write access to
      # ficaa1/homebrew-tap and nothing else. Without it the step fails the
      # job rather than leaving a release whose tap silently did not move.
      - name: Update the Homebrew tap
        if: ${{ !contains(env.TAG, '-') }}
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set; the tap would stay on the previous version"
            exit 1
          fi
          sha() {
            awk -v f="./micko_${VERSION}_$1.tar.gz" '$2 == f {print $1}' dist/checksums.txt
          }
          for target in darwin_arm64 darwin_amd64 linux_amd64 linux_arm64; do
            if [ -z "$(sha "$target")" ]; then
              echo "::error::no checksum for $target in dist/checksums.txt"
              exit 1
            fi
          done
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/ficaa1/homebrew-tap.git" tap
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          mkdir -p tap/Formula
          cat > tap/Formula/micko.rb <<FORMULA
          # Generated by the micko release workflow. Do not edit by hand:
          # the next release overwrites this file.
          class Micko < Formula
            desc "Keyboard-first terminal UI for Argo Workflows"
            homepage "https://github.com/${GITHUB_REPOSITORY}"
            version "${VERSION}"
            license "GPL-3.0-only"
            on_macos do
              on_arm do
                url "${base}/micko_${VERSION}_darwin_arm64.tar.gz"
                sha256 "$(sha darwin_arm64)"
              end
              on_intel do
                url "${base}/micko_${VERSION}_darwin_amd64.tar.gz"
                sha256 "$(sha darwin_amd64)"
              end
            end
            on_linux do
              on_arm do
                url "${base}/micko_${VERSION}_linux_arm64.tar.gz"
                sha256 "$(sha linux_arm64)"
              end
              on_intel do
                url "${base}/micko_${VERSION}_linux_amd64.tar.gz"
                sha256 "$(sha linux_amd64)"
              end
            end
            def install
              bin.install "micko"
            end
            test do
              assert_match version.to_s, shell_output("#{bin}/micko --version")
            end
          end
          FORMULA
          cd tap
          git add Formula/micko.rb
          # --cached, and after the add: a formula the tap does not have yet
          # is untracked, and an unstaged diff does not see it. Checking the
          # wrong one would skip the commit on the very first release.
          if git diff --cached --quiet; then
            echo "formula already at ${VERSION}"
            exit 0
          fi
          git config user.name "ficaa1"
          git config user.email "17272851+ficaa1@users.noreply.github.com"
          git commit -m "micko ${VERSION}"
          # HEAD rather than a branch name: a tap that has never been pushed
          # to is cloned on an unborn branch with no upstream.
          git push origin HEAD

  demo:
    name: update README demo
    needs: release
    if: ${{ !contains(needs.release.outputs.tag, '-') }}
    uses: ./.github/workflows/demo.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
