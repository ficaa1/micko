<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>micko --demo in your browser</title>
<meta name="description" content="Try micko, a keyboard-first terminal UI for Argo Workflows, in your browser: the real demo compiled to WebAssembly, with synthetic workflows and no cluster.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23efe4cf'/><rect x='9' y='6' width='14' height='20' fill='%23ca1b1d'/></svg>">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="xterm/xterm.css">
<link rel="stylesheet" href="demo.css">
</head>
<body>
<div class="paper"></div>
<main class="demo">
  <div class="win">
    <div class="bar"><i></i><i></i><i></i><b>micko --demo</b><a href="../" target="_top">micko ↗</a></div>
    <div class="screen-area">
      <div id="term"></div>
      <div class="gate" id="gate">
        <div class="card">
          <h1>Try micko<span class="cur"></span></h1>
          <p>The real <code>micko --demo</code>, compiled to WebAssembly and running in this tab: synthetic workflows, no cluster, nothing sent anywhere.</p>
          <p class="keys"><kbd>j</kbd> <kbd>k</kbd> move · <kbd>enter</kbd> open · <kbd>tab</kbd> sections · <kbd>?</kbd> help · <kbd>q</kbd> quit</p>
          <button class="pill red" id="start">▶ start the demo</button>
          <p class="note" id="status">About a 4 MB download. Works best with a keyboard.</p>
        </div>
      </div>
    </div>
  </div>
</main>
<script src="demo.js"></script>
</body>
</html>
